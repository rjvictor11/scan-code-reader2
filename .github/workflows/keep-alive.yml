# Supabase pauses free-plan projects after ~7 days with no activity. This
# reads one row every 3 days so the project (shared with scan-code-reader1)
# never goes idle that long. It uses the same public anon key the site
# already ships in js/supabase-client.js -- nothing secret here.
#
# If a run fails, GitHub emails you: that usually means the project got
# paused anyway (resume it in the Supabase dashboard) or the URL/key changed.

name: Keep Supabase awake

on:
  schedule:
    - cron: "17 12 */3 * *"  # every 3 days, 12:17 UTC
  workflow_dispatch:          # "Run workflow" button for a manual test

permissions:
  actions: write  # only for the re-enable step below

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from Supabase
        env:
          SUPABASE_URL: https://sdqkrvtohnkdffzcyrcj.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_mKzCPwmgFxAGI2PVD3ETJA_Aq_HMfLD
        run: |
          status=$(curl -s -o body.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/projects?select=code&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "HTTP $status"; cat body.txt; echo
          test "$status" = "200"

      # GitHub turns off scheduled workflows in a repo with no commits for
      # 60 days. Re-enabling it on every run keeps that timer from running
      # out, with no dummy commits.
      - name: Keep this schedule from being auto-disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"
