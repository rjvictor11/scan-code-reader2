<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<script src="js/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="vendor/html5-qrcode.min.js"></script>
<script src="vendor/zxing-library.min.js"></script>
<script src="js/barcode-reader.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triple Label Scanner</title>
<style>
 :root{--navy:#1f3350;--navy2:#2c4a70;--ink:#1a1f26;--muted:#6b7684;--line:#dfe4ea;--line2:#eef1f5;
  --bg:#f7f8fa;--panel:#fff;--surface:#fff;--steel:#e8eef6;--red:#c00000;--redbg:#fbeaea;
  --green:#1a7a3c;--greenbg:#e8f5ec;--blue:#2c5d9b;--bluebg:#e6eef9;--amber:#8a5a00;--amberbg:#fdf3dc;--focus:#3a6ea5;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
 :root[data-theme="dark"]{--ink:#e7ecf2;--muted:#93a0b3;--line:#2e3a4a;--line2:#212b38;
  --bg:#0e161f;--panel:#182330;--surface:#1f2c3c;--steel:#22324a;--red:#ff8a8a;--redbg:#3a2222;
  --green:#4ade80;--greenbg:#16321f;--blue:#8ab4f8;--bluebg:#1d2d47;--amber:#f5c26b;--amberbg:#3a2e14;--focus:#5b9bd5;}
 .theme-switch{display:inline-flex;align-items:center;cursor:pointer}
 .theme-switch input{position:absolute;opacity:0;width:1px;height:1px}
 .theme-switch-track{width:34px;height:19px;background:rgba(255,255,255,.25);border-radius:20px;position:relative;transition:background .15s;flex-shrink:0}
 .theme-switch-thumb{position:absolute;top:2px;left:2px;width:15px;height:15px;background:#fff;border-radius:50%;transition:transform .15s}
 .theme-switch input:checked+.theme-switch-track{background:rgba(255,255,255,.55)}
 .theme-switch input:checked+.theme-switch-track .theme-switch-thumb{transform:translateX(15px)}
 .theme-switch input:focus-visible+.theme-switch-track{outline:2px solid #fff;outline-offset:2px}
 *{box-sizing:border-box} [hidden]{display:none!important}
 body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
 .wrap{max-width:480px;margin:0 auto;padding:0 16px 80px}
 header{background:var(--navy);color:#fff;margin:0 0 16px;padding:18px 16px}
 header .head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
 header h1{margin:0;font-size:17px;font-weight:600}
 header .sub{color:#b9c6d8;font-size:12px;display:block;margin-top:4px}
 .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
 .project-bar{display:flex;align-items:center;gap:12px;background:var(--steel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin-bottom:14px}
 .project-bar label{margin:0;flex-shrink:0}
 .project-bar select{margin:0;flex:1;font-size:15px;font-weight:600;padding:8px 10px}
 .card h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
 .history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
 .history-head h2{margin:0}

 label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:4px;font-weight:600}
 input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin-bottom:10px;background:var(--surface);color:var(--ink)}
 input:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:var(--focus)}
 select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--surface);color:var(--ink);margin-bottom:10px}
 button{padding:12px;border:none;border-radius:8px;background:var(--navy);color:#fff;font-size:15px;cursor:pointer}
 button:hover{background:var(--navy2)} button:disabled{opacity:.6;cursor:default}
 button.ghost{background:none;color:var(--focus);padding:8px 10px;font-size:13px}
 button.primary{background:var(--navy);color:#fff}
 button.link-btn{background:none;color:#fff;text-decoration:underline;padding:0 0 0 8px;font-size:13px}
 button.link-inline{background:none;border:none;color:inherit;text-decoration:underline;padding:0;font-size:inherit;cursor:pointer}
 .msg{font-size:12.5px;margin-top:8px;min-height:16px}
 .msg.err{color:var(--red);background:var(--redbg);padding:8px 10px;border-radius:8px;margin-top:8px}
 .msg.warn{color:var(--amber);background:var(--amberbg);padding:8px 10px;border-radius:8px;margin:0 0 8px}
 .empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 0}
 .muted{color:var(--muted);font-size:12.5px}

 .set-progress{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:12px;font-size:12.5px;color:var(--muted)}
 .set-progress .step{padding:4px 8px;border-radius:12px;border:1px solid var(--line);white-space:nowrap}
 .set-progress .step.active{background:var(--navy);color:#fff;border-color:var(--navy)}
 .set-progress .step.done{background:var(--greenbg);color:var(--green);border-color:var(--green)}
 .set-progress .arrow{color:var(--muted)}

 #reader-region{width:100%;border-radius:8px;overflow:hidden;background:#000;position:relative}
 .live-video{display:block;width:100%;height:auto}
 .live-guide{position:absolute;left:50%;top:50%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.85);border-radius:6px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none}
 .live-guide.wide{width:92%;height:40%;aspect-ratio:auto}
 .live-hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;font-size:12px;text-shadow:0 1px 2px #000;pointer-events:none}
 #camera-controls{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
 #camera-controls button{flex:1;min-width:120px}

 .or-sep{text-align:center;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin:14px 0}
 .file-label{display:block;text-align:center;padding:11px;border:1px dashed var(--line);border-radius:8px;color:var(--focus);font-size:13.5px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500;margin-bottom:14px}
 .file-label input{display:none}

 .manual-row{display:flex;gap:8px}
 .manual-row input{margin-bottom:0}
 .manual-row button{flex-shrink:0}

 .preview{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--steel)}
 .preview-step{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;margin-bottom:4px}
 .preview-raw{font-family:var(--mono);font-size:14px;word-break:break-all;margin-bottom:8px;color:var(--ink)}
 .preview-fields{font-size:12.5px;color:var(--ink);margin-bottom:10px}
 .preview-fields .field-label{color:var(--muted);text-transform:uppercase;font-size:10.5px;letter-spacing:.4px;margin-right:4px}
 .preview-actions{display:flex;gap:8px}
 .preview-actions button{flex:1}

 .toast{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--green);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:space-between}

 .scan-group{padding:10px 0 10px 10px;border-bottom:1px solid var(--line2);border-left:3px solid var(--line)}
 .scan-group:last-child{border-bottom:none}
 .scan-group.complete{border-left-color:var(--green)}
 .group-status{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;margin-bottom:4px}
 .scan-group.complete .group-status{color:var(--green)}
 .scan-line{display:flex;align-items:flex-start;gap:8px;padding:3px 0;font-size:12.5px}
 .scan-line.missing{align-items:center}
 .scan-body{flex:1;min-width:0}
 .badge{display:inline-block;flex-shrink:0;min-width:34px;text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:2px 6px;border-radius:10px}
 .badge-old{background:var(--redbg);color:var(--red)}
 .badge-new{background:var(--greenbg);color:var(--green)}
 .badge-barcode{background:var(--bluebg);color:var(--blue)}
 .incomplete-set{padding:6px 0 8px;border-bottom:1px solid var(--line)}
 .incomplete-set:last-child{border-bottom:none}
 .incomplete-set .unpaired-row{border-bottom:none;padding:4px 0}
 .incomplete-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
 .incomplete-foot button{padding:6px 10px;font-size:12.5px}
 .scan-raw{font-family:var(--mono);font-size:12.5px;word-break:break-all}
 .scan-sub{color:var(--muted);font-size:11.5px}
 .scan-time{color:var(--muted);font-size:11px;margin-top:2px}

 .unpaired-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
 .unpaired-row:last-child{border-bottom:none}
 .unpaired-row .scan-raw{flex:1;min-width:0}
 .unpaired-row button{flex-shrink:0;padding:6px 10px;font-size:12.5px}

 .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
 .modal{background:var(--panel);border-radius:10px;padding:18px;width:100%;max-width:420px;max-height:80vh;overflow:auto}
 .modal h3{margin:0 0 10px;font-size:14px;color:var(--ink)}
</style></head><body>
<header>
 <div class="head-row">
  <div>
   <h1>Triple Label Scanner &middot; WS</h1>
   <span class="sub">Scan the old QR, the new QR, then the 1D barcode &mdash; all three save together with timestamps.</span>
  </div>
  <label class="theme-switch" title="Toggle dark mode">
   <input type="checkbox" id="theme-toggle" aria-label="Toggle dark mode">
   <span class="theme-switch-track"><span class="theme-switch-thumb"></span></span>
  </label>
 </div>
</header>
<div class="wrap">

 <div class="project-bar" id="project-bar">
  <label for="project-select">Project</label>
  <select id="project-select">
   <option value="WS">WS</option>
  </select>
 </div>

 <div class="card">
  <h2>Scan</h2>
  <div id="set-progress" class="set-progress">
   <span class="step">1. Old QR</span>
   <span class="arrow">&rarr;</span>
   <span class="step">2. New QR</span>
   <span class="arrow">&rarr;</span>
   <span class="step">3. 1D barcode</span>
  </div>

  <div id="reader-region" hidden></div>
  <div id="camera-controls">
   <button id="btn-start-camera">Start camera</button>
   <button id="btn-stop-camera" class="ghost" hidden>Stop camera</button>
   <button id="btn-torch" class="ghost" hidden>Torch: off</button>
  </div>
  <select id="camera-select" hidden></select>
  <div id="camera-error" class="msg err" hidden></div>

  <div class="or-sep">or</div>

  <label class="file-label">Upload a photo of the label
   <input type="file" id="file-input" accept="image/*">
  </label>
  <div id="photo-status" class="muted" style="text-align:center;margin:-6px 0 12px" hidden>Reading photo&hellip;</div>

  <label>Manual entry</label>
  <div class="manual-row">
   <input type="text" id="manual-input" placeholder="P68744965AA/T015U162600613">
   <button id="btn-manual-add">Add</button>
  </div>

  <div id="preview" class="preview" hidden>
   <div class="preview-step" id="preview-step"></div>
   <div class="preview-raw" id="preview-raw"></div>
   <div class="preview-fields" id="preview-fields"></div>
   <div class="preview-actions">
    <button id="btn-save" class="primary">Save</button>
    <button id="btn-rescan" class="ghost">Discard &amp; rescan</button>
   </div>
  </div>

  <div id="save-toast" class="toast" hidden></div>
 </div>

 <div class="card" id="link-card" hidden>
  <h2>Waiting to be completed</h2>
  <div id="unpaired-list"></div>
 </div>

 <div class="card">
  <div class="history-head">
   <h2>Recent scans</h2>
   <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
    <button class="ghost" id="btn-download-report">Download report</button>
    <button class="ghost" id="btn-download-report-all" title="Every project combined, not just the one selected above">Download all</button>
    <button class="ghost" id="btn-refresh">Refresh</button>
   </div>
  </div>
  <input type="text" id="search-input" placeholder="Search EBOM, traceability, or raw code">
  <div id="history-list"></div>
 </div>

</div>

<div id="link-modal" class="modal-backdrop" hidden>
 <div class="modal">
  <h3>Complete the set from existing scans</h3>
  <div id="link-modal-target" class="muted" style="margin-bottom:10px"></div>
  <input type="text" id="link-search" placeholder="Search to find its pair&hellip;">
  <div id="link-results"></div>
  <button class="ghost" id="link-cancel">Cancel</button>
 </div>
</div>

<script src="js/app.js"></script>
</body></html>
